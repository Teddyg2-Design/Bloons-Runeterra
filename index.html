function makeEnemy(layer){return{s:0,v:75+wave*2,layer,hp:LAYER_HP[layer-1],max:LAYER_HP[layer-1],slow:0,stun:0,poison:0,phase:Math.random()*6.28,hitFlash:0,lean:0}}
